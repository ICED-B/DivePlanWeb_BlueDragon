services:
  backend:
    build:
      context: ./backend
    container_name: dive_plan_web_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/backend:cached
    # Nacteni promennych z .env
    env_file:
      - .env
    environment:
      - FLASK_ENV=development # Nebo production
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_HOST=db # Nazev sluzby databaze
      - DATABASE_PORT=5432
    command: /bin/sh -c "while sleep 1000; do :; done"
    # command: flask run --host=0.0.0.0 --port=8000  
    # pro automatický běh
    networks:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
    container_name: dive_plan_web_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/workspace/frontend:cached
    environment:
      - NODE_ENV=development
      # Zajistí, že Vite bude naslouchat na všech rozhraních a povolí HMR přes Docker
      - VITE_SERVER_HOST=0.0.0.0
    command: /bin/sh -c "while sleep 1000; do :; done"
    # command: npm install && npm run dev --host 0.0.0.0 --port 5173
    # pro automatický běh 
    depends_on:
      - backend
    networks:
      - frontend

  db:
    image: postgres:latest  # postgres:16 (stabilní)
    container_name: dive_plan_web_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - backend
    # Kontrola stavu databáze
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s # Dává DB čas na start před první kontrolou
    restart: unless-stopped


volumes:
  postgres-data:
    # pgadmin-data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
